services:
  # Backend API & Worker combined on Render Free Tier ($0/month)
  - type: web
    name: railsync-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head && python scripts/seed_cloud.py
    startCommand: sh -c "python -m railsync.worker & uvicorn railsync.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: RAILSYNC_DATABASE_URL
        fromDatabase:
          name: railsync-db
          property: connectionString
      - key: RAILSYNC_ENVIRONMENT
        value: production
      - key: RAILSYNC_SESSION_COOKIE_SECURE
        value: "true"
      - key: RAILSYNC_BROWSER_ORIGINS
        value: '["https://gst-train.vercel.app","https://web-nine-mocha-73.vercel.app","https://web-nqcfea9w7-n-v-naga-tharuns-projects.vercel.app"]'

databases:
  - name: railsync-db
    databaseName: railsync
    user: railsync
    plan: free

