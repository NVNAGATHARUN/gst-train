services:
  # Backend API
  - type: web
    name: railsync-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head && python scripts/seed_cloud.py
    startCommand: uvicorn railsync.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: RAILSYNC_DATABASE_URL
        fromDatabase:
          name: railsync-db
          property: connectionString
      - key: RAILSYNC_ENVIRONMENT
        value: production
      - key: RAILSYNC_SESSION_COOKIE_SECURE
        value: "true"
      - key: RAILSYNC_BROWSER_ORIGINS
        sync: false # Set to your Vercel or frontend URL, e.g. ["https://railsync.vercel.app"]

  # Background Optimization Worker
  - type: worker
    name: railsync-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m railsync.worker
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: RAILSYNC_DATABASE_URL
        fromDatabase:
          name: railsync-db
          property: connectionString

databases:
  - name: railsync-db
    databaseName: railsync
    user: railsync
    plan: free
